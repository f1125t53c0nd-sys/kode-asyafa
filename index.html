<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survei Liptint 💄</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ffb6cf;--pink2:#ff8fb6;--pinkbg:#fff0f5;--yellow:#ffe79a;--yellow2:#ffd45e;--ink:#5b3a4a;--soft:#a0788a;--card:#ffffffd9}
*{box-sizing:border-box;margin:0}
body{font-family:'Nunito',sans-serif;color:var(--ink);min-height:100vh;background:linear-gradient(135deg,var(--pinkbg),#fff9e0);padding:24px 14px 60px;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(40px);opacity:.55;z-index:-1;animation:float 12s ease-in-out infinite}
.b1{width:300px;height:300px;background:var(--pink);top:-80px;left:-80px}
.b2{width:260px;height:260px;background:var(--yellow);bottom:-60px;right:-60px;animation-delay:-4s}
.b3{width:180px;height:180px;background:#ffd0e2;top:45%;right:8%;animation-delay:-8s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-40px) scale(1.12)}}
.wrap{max-width:560px;margin:0 auto}
header{text-align:center;margin-bottom:20px;animation:rise .8s both}
h1{font-family:'Fredoka';font-weight:600;font-size:2rem;color:var(--pink2)}
h1 span{display:inline-block;animation:wiggle 2.5s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg) scale(1.15)}}
header p{color:var(--soft);margin-top:4px}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.tabs{display:flex;background:#fff;border-radius:50px;padding:5px;margin-bottom:18px;box-shadow:0 6px 20px #ffb6cf55;position:relative;animation:rise .8s .1s both}
.tab{flex:1;border:0;background:none;padding:10px;font:600 .95rem 'Fredoka';color:var(--soft);cursor:pointer;z-index:1;transition:color .3s}
.tab.on{color:#fff}
.pill{position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);background:linear-gradient(135deg,var(--pink2),var(--pink));border-radius:50px;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.card{background:var(--card);backdrop-filter:blur(8px);border-radius:28px;padding:24px;box-shadow:0 10px 35px #ffb6cf66;border:2px solid #fff}
.view{display:none}.view.on{display:block;animation:rise .55s both}
.f{margin-bottom:18px;opacity:0;animation:rise .6s both}
.view.on .f:nth-child(1){animation-delay:.05s}.view.on .f:nth-child(2){animation-delay:.12s}.view.on .f:nth-child(3){animation-delay:.19s}
.view.on .f:nth-child(4){animation-delay:.26s}.view.on .f:nth-child(5){animation-delay:.33s}.view.on .f:nth-child(6){animation-delay:.4s}
.view.on .f:nth-child(7){animation-delay:.47s}.view.on .f:nth-child(8){animation-delay:.54s}
label{display:block;font:500 .95rem 'Fredoka';margin-bottom:7px}
label small{color:var(--soft);font-family:'Nunito'}
input,textarea{width:100%;padding:12px 16px;border:2px solid #ffd9e6;border-radius:16px;font:inherit;color:var(--ink);background:#fff;transition:.3s;outline:0}
input:focus,textarea:focus{border-color:var(--pink2);box-shadow:0 0 0 5px #ffb6cf44;transform:translateY(-2px)}
textarea{resize:vertical;min-height:70px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid #ffe08a;background:#fffbe8;color:var(--ink);padding:8px 14px;border-radius:50px;font:600 .88rem 'Nunito';cursor:pointer;transition:.3s cubic-bezier(.34,1.56,.64,1)}
.chip:hover{transform:translateY(-3px) scale(1.05)}
.chip.on{background:var(--yellow2);border-color:var(--yellow2);transform:scale(1.08);box-shadow:0 6px 14px #ffd45e88}
.stars{display:flex;gap:6px;align-items:center}
.star{font-size:2rem;background:none;border:0;cursor:pointer;filter:grayscale(1) opacity(.35);transition:.25s}
.star.on{filter:none;transform:scale(1.15)}
.star.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.7) rotate(15deg)}}
#label{margin-left:8px;color:var(--pink2);font:500 .9rem 'Fredoka'}
button.go{width:100%;padding:15px;border:0;border-radius:50px;font:600 1.1rem 'Fredoka';color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--pink2),#ffb26b);box-shadow:0 8px 22px #ff8fb677;transition:.3s;position:relative;overflow:hidden}
button.go:hover{transform:translateY(-3px);box-shadow:0 12px 28px #ff8fb699}
button.go:active{transform:scale(.97)}
button.go.load{pointer-events:none;opacity:.8}
button.go.load::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,#fff8,transparent);animation:shine 1s infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.stats{display:flex;gap:12px;margin-bottom:22px}
.stat{flex:1;text-align:center;padding:14px;border-radius:20px;background:#fff6d6}
.stat:first-child{background:#ffe3ee}
.stat b{display:block;font:600 1.9rem 'Fredoka';color:var(--pink2)}
.stat span{font-size:.8rem;color:var(--soft)}
h3{font:500 1.05rem 'Fredoka';margin:18px 0 10px}
.row{margin-bottom:11px}
.row .t{display:flex;justify-content:space-between;font-size:.88rem;font-weight:700;margin-bottom:4px}
.track{height:14px;background:#fff0f5;border-radius:20px;overflow:hidden}
.fill{height:100%;width:0;border-radius:20px;background:linear-gradient(90deg,var(--pink),var(--pink2));transition:width 1.1s cubic-bezier(.22,1,.36,1)}
.fill.y{background:linear-gradient(90deg,var(--yellow),var(--yellow2))}
.empty{text-align:center;color:var(--soft);padding:20px}
#ov{position:fixed;inset:0;background:#5b3a4a55;display:grid;place-items:center;opacity:0;pointer-events:none;transition:.35s;z-index:9}
#ov.on{opacity:1;pointer-events:auto}
.pop-box{background:#fff;border-radius:30px;padding:34px 30px;text-align:center;max-width:300px;transform:scale(.6);transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
#ov.on .pop-box{transform:scale(1)}
.pop-box .em{font-size:3.5rem;animation:wiggle 1.5s infinite}
.pop-box h2{font:600 1.4rem 'Fredoka';color:var(--pink2);margin:8px 0 4px}
.pop-box button{margin-top:16px;border:0;background:var(--yellow2);padding:10px 26px;border-radius:50px;font:600 1rem 'Fredoka';cursor:pointer;color:var(--ink)}
.conf{position:fixed;top:-30px;font-size:1.5rem;animation:fall 2.4s linear forwards;z-index:10;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.7}}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,120px);background:#fff;padding:12px 22px;border-radius:50px;box-shadow:0 8px 24px #ff8fb666;transition:transform .5s cubic-bezier(.34,1.56,.64,1);z-index:11;font-weight:700}
#toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.f{opacity:1}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="wrap">
  <header><h1><span>💄</span> Survei Liptint</h1><p>Ceritain liptint favoritmu yuk! 🌸</p></header>
  <div class="tabs"><div class="pill" id="pill"></div>
    <button class="tab on" data-v="form">✏️ Isi Survei</button>
    <button class="tab" data-v="hasil">📊 Hasil</button></div>

  <div class="card">
    <form id="form" class="view on" autocomplete="off">
      <div class="f"><label>Nama panggilan <small>(boleh kosong)</small></label><input id="nama" maxlength="30" placeholder="cth: Mimi"></div>
      <div class="f"><label>Merek liptint favoritmu 💗</label><input id="merek" maxlength="40" placeholder="cth: Rom&nd, Wardah, Y.O.U ..."></div>
      <div class="f"><label>Nama / nomor shade <small>(boleh kosong)</small></label><input id="shade" maxlength="40" placeholder="cth: #03 Rosy"></div>
      <div class="f"><label>Rentang harga yang kamu bayar 💰</label>
        <div class="chips" data-k="harga">
          <button type="button" class="chip" data-v="< Rp25.000">&lt; 25rb</button>
          <button type="button" class="chip" data-v="Rp25.000 - 50.000">25 – 50rb</button>
          <button type="button" class="chip" data-v="Rp50.000 - 100.000">50 – 100rb</button>
          <button type="button" class="chip" data-v="> Rp100.000">&gt; 100rb</button></div></div>
      <div class="f"><label>Seberapa puas kamu? ⭐</label>
        <div class="stars"><button type="button" class="star">⭐</button><button type="button" class="star">⭐</button><button type="button" class="star">⭐</button><button type="button" class="star">⭐</button><button type="button" class="star">⭐</button><span id="label"></span></div></div>
      <div class="f"><label>Ketahanan warna ⏳</label>
        <div class="chips" data-k="tahan">
          <button type="button" class="chip" data-v="< 3 jam">&lt; 3 jam</button>
          <button type="button" class="chip" data-v="3 - 6 jam">3 – 6 jam</button>
          <button type="button" class="chip" data-v="> 6 jam">&gt; 6 jam</button></div></div>
      <div class="f"><label>Mau beli lagi? 🛍️</label>
        <div class="chips" data-k="beli">
          <button type="button" class="chip" data-v="Ya">Pasti!</button>
          <button type="button" class="chip" data-v="Mungkin">Mungkin</button>
          <button type="button" class="chip" data-v="Tidak">Enggak</button></div></div>
      <div class="f"><label>Kesan singkat <small>(boleh kosong)</small></label><textarea id="komentar" maxlength="300" placeholder="Teksturnya gimana, wanginya, dll..."></textarea></div>
      <div class="f"><button class="go" id="btn">Kirim Jawaban 💌</button></div>
    </form>

    <div id="hasil" class="view"><div class="empty">Memuat... 🌷</div></div>
  </div>
</div>

<div id="ov"><div class="pop-box"><div class="em">🎀</div><h2>Terima kasih!</h2><p>Jawabanmu sudah tersimpan 💖</p><button id="ok">Yay!</button></div></div>
<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
